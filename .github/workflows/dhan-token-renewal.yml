# Keeps the Dhan access token alive so it never expires on you.
#
# Dhan invalidates access tokens every 24 hours. This mints a fresh one via
# PIN + TOTP each morning before the market opens and stores it in the
# database, which is then pushed back to GitHub — so the app picks
# up a valid token whenever you next open it, with nothing to paste by hand.
name: Dhan token renewal

on:
  schedule:
    # 02:30 UTC = 08:00 IST, about 75 minutes before the 09:15 IST open.
    # Runs every day: a token minted on Friday would otherwise be dead by
    # Monday, and by weekend research too.
    - cron: "30 2 * * *"
  workflow_dispatch:        # lets you renew on demand from the Actions tab

concurrency:
  # Never let two runs write the database backup at the same time.
  group: dhan-db
  cancel-in-progress: false

permissions:
  contents: write           # backup_db_to_github() commits via the API

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Renew Dhan access token
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          # The workflow's own token, deliberately, and not secrets.GH_BACKUP_TOKEN.
          # Both write to this same repository (GH_REPO below is github.repository),
          # but a personal access token can be read-only — and this one was: the
          # app's first backup failed with "Resource not accessible by personal
          # access token" when it tried to create the backup branch. A PAT's
          # permissions are invisible from here, so preferring it meant a five-hour
          # history build could finish and then fail to save anything. github.token
          # is guaranteed write by the contents:write permission above.
          GH_BACKUP_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Defaults to a dedicated branch rather than the repository's default
          # one: each backup commits the whole SQLite file, so leaving it unset
          # would add a multi-megabyte binary blob to main's history every run.
          # Set a DB_BACKUP_BRANCH repository variable to override.
          DB_BACKUP_BRANCH: ${{ vars.DB_BACKUP_BRANCH || 'db-backup' }}
          BACKUP_STAGE_PATH: ${{ runner.temp }}/market_data.sqlite3.gz
        run: python daily_job.py token

      # The job stages the database instead of uploading it; git is what
      # actually stores it. See scripts/push_backup.sh for why.
      - name: Push the database to the backup branch
        env:
          BACKUP_STAGE_PATH: ${{ runner.temp }}/market_data.sqlite3.gz
          GH_PUSH_TOKEN: ${{ github.token }}
          DB_BACKUP_BRANCH: ${{ vars.DB_BACKUP_BRANCH || 'db-backup' }}
        run: ./scripts/push_backup.sh
