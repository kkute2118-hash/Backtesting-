# Runs the forward test every trading day without the app being open.
#
# The web UI only runs the engine while its API server is up, so
# the forward test could not advance on its own. This drives the same engine
# (backend/app/engine/core.py, via daily_job.py) on GitHub's runners after the NSE close:
#
#   restore DB -> renew token -> sync candles -> resolve open positions
#   -> scan the just-closed session -> record candidates -> back up DB
#
# The scan runs AFTER the close on purpose. An intraday scan can show a setup
# at 11:00 that has vanished by 15:30; recording that as a forward test would
# pollute the learning data with signals that never really existed.
name: Daily forward test

on:
  schedule:
    # NSE closes 15:30 IST (10:00 UTC). Dhan publishes the finished daily
    # candle some time after that, so the first attempt allows ~1h20m.
    - cron: "20 11 * * 1-5"     # 16:50 IST
    # Second attempt in case Dhan was still late. The job is idempotent, and
    # add_forward_candidates() refuses a duplicate for the same
    # symbol/strategy/date — so if the first run already succeeded, this one
    # simply finds nothing new to add.
    - cron: "30 13 * * 1-5"     # 19:00 IST
  workflow_dispatch:
    # Run it by hand from the Actions tab whenever you want.

concurrency:
  group: dhan-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run daily forward test
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          # The workflow's own token, deliberately, and not secrets.GH_BACKUP_TOKEN.
          # Both write to this same repository (GH_REPO below is github.repository),
          # but a personal access token can be read-only — and this one was: the
          # app's first backup failed with "Resource not accessible by personal
          # access token" when it tried to create the backup branch. A PAT's
          # permissions are invisible from here, so preferring it meant a five-hour
          # history build could finish and then fail to save anything. github.token
          # is guaranteed write by the contents:write permission above.
          GH_BACKUP_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Defaults to a dedicated branch rather than the repository's default
          # one: each backup commits the whole SQLite file, so leaving it unset
          # would add a multi-megabyte binary blob to main's history every run.
          # Set a DB_BACKUP_BRANCH repository variable to override.
          DB_BACKUP_BRANCH: ${{ vars.DB_BACKUP_BRANCH || 'db-backup' }}
          # Optional tuning — set these as repository Variables to change them
          # without editing this file.
          SCAN_UNIVERSE: ${{ vars.SCAN_UNIVERSE }}
          SCAN_STRATEGIES: ${{ vars.SCAN_STRATEGIES }}
          SCAN_MIN_SCORE: ${{ vars.SCAN_MIN_SCORE }}
          SYNC_TAIL_DAYS: ${{ vars.SYNC_TAIL_DAYS }}
          BACKUP_STAGE_PATH: ${{ runner.temp }}/market_data.sqlite3.gz
        run: python daily_job.py daily

      # The job stages the database instead of uploading it; git is what
      # actually stores it. See scripts/push_backup.sh for why.
      - name: Push the database to the backup branch
        env:
          BACKUP_STAGE_PATH: ${{ runner.temp }}/market_data.sqlite3.gz
          GH_PUSH_TOKEN: ${{ github.token }}
          DB_BACKUP_BRANCH: ${{ vars.DB_BACKUP_BRANCH || 'db-backup' }}
        run: ./scripts/push_backup.sh
