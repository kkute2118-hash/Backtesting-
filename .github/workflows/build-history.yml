# Build the candle history from scratch. Run once, by hand.
#
# The daily job only tops up the newest sessions and refuses to scan a store
# with no history, so something has to download that history first. A free-tier
# web host cannot: it has a fraction of a CPU and restarts under load, and every
# restart both kills the download and wipes the database. A GitHub runner has
# real cores, 16 GB and no restarts, so it does the job here and pushes the
# result to the backup branch — which is where the app and the daily job both
# read it from.
name: Build candle history

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to build (must match a name the engine knows)'
        required: true
        default: 'Nifty 500'
        type: choice
        options:
          - 'Nifty 500'
          - 'Nifty Midcap 150'
          - 'Nifty Smallcap 100'
          - 'Nifty Smallcap 250'
          - 'NSE All Cash (~2000)'
      years:
        description: 'Years of history (3 is enough for every strategy)'
        required: true
        default: '3'
        type: string

concurrency:
  # Never let this and the daily job write the backup at the same time.
  group: dhan-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Dhan is rate-limited to ~5 requests/second, so a large universe is slow.
    # 350 minutes stays inside GitHub's 6-hour ceiling with room to spare.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Fails in two seconds with a message on the run's summary page rather
      # than in the middle of a log, because this is the one thing a first-time
      # run gets wrong: Actions secrets are a separate store from the web host's
      # environment variables, so credentials set on the host are not here.
      - name: Check the Dhan credentials are present
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          if [ -n "$DHAN_CLIENT_ID" ] && [ -n "$DHAN_PIN" ] && [ -n "$DHAN_TOTP_SECRET" ]; then
            echo "Using PIN + TOTP; the job will mint its own 24-hour token."
          elif [ -n "$DHAN_ACCESS_TOKEN" ]; then
            echo "Using the manual DHAN_ACCESS_TOKEN."
          else
            echo "::error title=Dhan credentials missing::Add DHAN_CLIENT_ID, DHAN_PIN and DHAN_TOTP_SECRET (or DHAN_ACCESS_TOKEN) under Settings -> Secrets and variables -> Actions. Credentials set on your web host are a different store and are not visible here."
            exit 1
          fi

      - name: Build history
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          # The workflow's own token, deliberately, and not secrets.GH_BACKUP_TOKEN.
          # Both write to this same repository (GH_REPO below is github.repository),
          # but a personal access token can be read-only — and this one was: the
          # app's first backup failed with "Resource not accessible by personal
          # access token" when it tried to create the backup branch. A PAT's
          # permissions are invisible from here, so preferring it meant a five-hour
          # history build could finish and then fail to save anything. github.token
          # is guaranteed write by the contents:write permission above.
          GH_BACKUP_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Defaults to a dedicated branch rather than the repository's default
          # one: each backup commits the whole SQLite file, so leaving it unset
          # would add a multi-megabyte binary blob to main's history every run.
          # Set a DB_BACKUP_BRANCH repository variable to override.
          DB_BACKUP_BRANCH: ${{ vars.DB_BACKUP_BRANCH || 'db-backup' }}
          SCAN_UNIVERSE: ${{ inputs.universe }}
          BOOTSTRAP_YEARS: ${{ inputs.years }}
        run: python daily_job.py bootstrap
