[pytest]
testpaths = tests
# The regression scripts are executed as subprocesses by
# tests/test_regression_scripts.py, not collected directly: they are scripts
# that call sys.exit() and set environment variables before importing the
# engine, both of which break under in-process collection.
norecursedirs = regression
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
