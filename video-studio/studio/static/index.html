<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seedance Studio</title>
<style>
:root {
  --bg: #0d0e12; --panel: #16181f; --line: #262934; --text: #e8e9ee;
  --muted: #8b8fa0; --accent: #c6f432; --accent-ink: #11140a; --bad: #ff6b6b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
#keywarn { margin-left: auto; color: var(--bad); font-size: 13px; }
main { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 51px); }
aside { border-right: 1px solid var(--line); padding: 18px; display: flex;
  flex-direction: column; gap: 14px; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
textarea, select, input[type=text], input[type=number] { width: 100%;
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; font: inherit; }
textarea { min-height: 120px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs { display: flex; background: var(--panel); border-radius: 8px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: none; color: var(--muted);
  padding: 7px; border-radius: 6px; font: inherit; cursor: pointer; }
.tabs button.on { background: var(--line); color: var(--text); }
.drop { border: 1px dashed var(--line); border-radius: 8px; padding: 12px;
  text-align: center; color: var(--muted); cursor: pointer; position: relative; }
.drop img { max-width: 100%; max-height: 140px; border-radius: 6px; display: block; margin: 0 auto; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chips button.on { border-color: var(--accent); color: var(--accent); }
#go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 12px; font: 600 15px system-ui; cursor: pointer; }
#go:disabled { opacity: .5; cursor: wait; }
#err { color: var(--bad); font-size: 13px; min-height: 1em; }
section { padding: 18px; }
#gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card video, .card .wait { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
.card .wait { display: grid; place-items: center; color: var(--muted); }
.card .meta { padding: 10px 12px; }
.card .p { margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card .tags { color: var(--muted); font-size: 12px; }
.card .acts { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; }
.card .acts a, .card .acts button { color: var(--muted); background: none; border: 0;
  padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
.card.failed .wait { color: var(--bad); padding: 12px; text-align: center; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 8px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header><span class="dot"></span><h1>Seedance Studio</h1><span id="keywarn"></span></header>
<main>
<aside>
  <div class="tabs" id="mode">
    <button data-m="text" class="on">Text to video</button>
    <button data-m="image">Image to video</button>
  </div>

  <div id="imgbox" hidden>
    <label>Start frame</label>
    <div class="drop" id="drop1"><span>Drop or choose an image</span><input type="file" id="image" accept="image/*"></div>
    <div id="endbox" style="margin-top:10px">
      <label>End frame (optional)</label>
      <div class="drop" id="drop2"><span>Drop or choose an image</span><input type="file" id="end_image" accept="image/*"></div>
    </div>
  </div>

  <div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="A red fox trots through fresh snow at dawn, breath steaming, pine forest behind"></textarea>
  </div>

  <div><label>Camera</label><div class="chips" id="camera"></div></div>
  <div><label>Look</label><div class="chips" id="style"></div></div>

  <div><label for="model">Model</label><select id="model"></select>
    <div id="modelnote" style="color:var(--muted);font-size:12px;margin-top:4px"></div></div>

  <div class="row">
    <div><label for="resolution">Resolution</label><select id="resolution"></select></div>
    <div><label for="duration">Length (s)</label><select id="duration"></select></div>
  </div>
  <div class="row">
    <div id="arbox"><label for="aspect_ratio">Aspect</label><select id="aspect_ratio"></select></div>
    <div><label for="seed">Seed</label><input type="number" id="seed" placeholder="random"></div>
  </div>
  <label class="check" id="audiobox"><input type="checkbox" id="generate_audio" checked> Generate audio</label>
  <label class="check" id="fixedbox"><input type="checkbox" id="camera_fixed"> Lock camera</label>

  <button id="go">Generate</button>
  <div id="err"></div>
</aside>
<section><div id="gallery"></div></section>
</main>

<script>
const $ = id => document.getElementById(id);
let M = {}, mode = "text", cam = "none", look = "none";

function opts(sel, values) {
  sel.innerHTML = values.map(v => `<option>${v}</option>`).join("");
}
function chips(box, values, pick) {
  box.innerHTML = values.map(v => `<button data-v="${v}" class="${v === "none" ? "on" : ""}">${v}</button>`).join("");
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    pick(b.dataset.v);
  };
}
function syncModel() {
  const m = M[$("model").value], o = m.options;
  $("modelnote").textContent = m.note;
  opts($("resolution"), o.resolution);
  opts($("duration"), o.duration);
  opts($("aspect_ratio"), o.aspect_ratio);
  $("audiobox").hidden = !o.generate_audio;
  $("fixedbox").hidden = !o.camera_fixed;
  $("endbox").hidden = !o.end_image;
  $("arbox").style.visibility = mode === "image" ? "hidden" : "visible";
}
function preview(input, drop) {
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const span = drop.querySelector("span, img");
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    span.replaceWith(img);
  };
}

$("mode").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m;
  $("mode").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("imgbox").hidden = mode !== "image";
  syncModel();
};
$("model").onchange = syncModel;
preview($("image"), $("drop1"));
preview($("end_image"), $("drop2"));

$("go").onclick = async () => {
  $("err").textContent = "";
  const fd = new FormData();
  fd.append("model", $("model").value);
  fd.append("prompt", $("prompt").value);
  fd.append("camera", cam);
  fd.append("style", look);
  for (const k of ["resolution", "duration", "seed"]) fd.append(k, $(k).value);
  if (mode === "text") fd.append("aspect_ratio", $("aspect_ratio").value);
  fd.append("generate_audio", $("generate_audio").checked);
  fd.append("camera_fixed", $("camera_fixed").checked);
  if (mode === "image") {
    if (!$("image").files[0]) { $("err").textContent = "Choose a start frame first."; return; }
    fd.append("image", $("image").files[0]);
    if ($("end_image").files[0] && !$("endbox").hidden) fd.append("end_image", $("end_image").files[0]);
  }
  $("go").disabled = true;
  try {
    const r = await fetch("/api/generate", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    await load();
  } catch (e) { $("err").textContent = e.message; }
  $("go").disabled = false;
};

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function card(j) {
  const s = j.settings || {};
  const tags = [M[j.model]?.label || j.model, s.resolution, s.duration && s.duration + "s",
    j.camera !== "none" && j.camera, j.style !== "none" && j.style, j.seed_used != null && "seed " + j.seed_used]
    .filter(Boolean).join(" · ");
  let media;
  if (j.status === "COMPLETED") media = `<video src="/videos/${j.file}" controls loop playsinline></video>`;
  else if (j.status === "FAILED") media = `<div class="wait">${esc(j.error || "Failed")}</div>`;
  else media = `<div class="wait"><div><div class="spin"></div>${j.status === "IN_QUEUE" && j.queue_position != null ? "Queued #" + (j.queue_position + 1) : "Rendering…"}</div></div>`;
  return `<div class="card ${j.status === "FAILED" ? "failed" : ""}">${media}
    <div class="meta"><p class="p">${esc(j.prompt)}</p><div class="tags">${esc(tags)}</div>
    <div class="acts">${j.file ? `<a href="/videos/${j.file}" download>Download</a>` : ""}
    <button data-reuse="${j.id}">Reuse prompt</button><button data-del="${j.id}">Delete</button></div></div></div>`;
}

let jobs = [];
async function load() {
  jobs = await (await fetch("/api/jobs")).json();
  $("gallery").innerHTML = jobs.length ? jobs.map(card).join("") : `<div class="empty">Your videos will appear here.</div>`;
}
$("gallery").onclick = async e => {
  const del = e.target.dataset.del, reuse = e.target.dataset.reuse;
  if (del && confirm("Delete this video?")) { await fetch("/api/jobs/" + del, { method: "DELETE" }); load(); }
  if (reuse) { const j = jobs.find(x => x.id === reuse); $("prompt").value = j.prompt; $("prompt").focus(); }
};

// Check on unfinished jobs every 5 seconds.
setInterval(async () => {
  const live = jobs.filter(j => j.status !== "COMPLETED" && j.status !== "FAILED");
  if (!live.length) return;
  await Promise.all(live.map(j => fetch("/api/jobs/" + j.id)));
  load();
}, 5000);

(async () => {
  const d = await (await fetch("/api/models")).json();
  M = d.models;
  $("model").innerHTML = Object.entries(M).map(([k, m]) => `<option value="${k}">${m.label}</option>`).join("");
  chips($("camera"), d.camera, v => cam = v);
  chips($("style"), d.style, v => look = v);
  if (!d.has_key) $("keywarn").textContent = "FAL_KEY not set: generation will fail";
  syncModel();
  load();
})();
</script>
</body>
</html>
