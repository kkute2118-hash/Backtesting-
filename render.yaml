# Render blueprint for the FastAPI backend.
#
# ---------------------------------------------------------------------------
# THIS FILE DOES NOT CONFIGURE THE LIVE SERVICES.
#
# ati-lab-api and ati-lab were created by hand in the Render dashboard, not
# imported as a Blueprint, so nothing here is applied to them. Editing this
# file changes nothing in production. It is a reference for what the services
# SHOULD look like, and the starting point if they are ever recreated from it.
#
# Confirmed by reading the live services back: their rootDir is empty and the
# build commands cd into backend/ and frontend/ themselves, neither of which
# this file describes.
#
# Everything below therefore has to be set by hand, per service, under
# Settings and Environment:
#
#   ati-lab-api (Python)     Health Check Path  /health
#                            Environment        API_ACCESS_KEY, the DHAN_*
#                                               and GH_* variables,
#                                               CORS_ORIGINS
#   ati-lab (Next.js)        Health Check Path  /health
#                            Environment        API_ACCESS_KEY (same value as
#                                               the API service),
#                                               NEXT_PUBLIC_API_URL,
#                                               API_BACKEND_URL
#
# Order matters for the health check: the route has to be deployed BEFORE the
# path is set. Setting it against a build that lacks /health makes the check
# 404, the deploy never goes healthy, and it blocks the very commit that would
# add the route. That happened on the web service and needed a manual cancel.
#
# To make this file authoritative instead, import it as a Blueprint in the
# Render dashboard - a deliberate change to how the services are managed, not
# a cleanup.
# ---------------------------------------------------------------------------
#
# Configured for the FREE plan, which has no persistent disk: the filesystem is
# discarded whenever the service sleeps. The database is therefore protected by
# the GitHub backup instead — the API restores it on every cold start and pushes
# it again after a sync (see app/services/bootstrap.py). That makes the three
# GH_* variables below load-bearing rather than optional: without them, every
# sleep loses your candles, forward tests and accumulated learning.
#
# To run without that dependency, switch `plan` to `starter` and uncomment the
# `disk` block: a real disk is simpler and removes the 15-minute sleep, at a
# monthly cost.
#
# See docs/DEPLOYMENT.md for the full walkthrough.

services:
  - type: web
    name: ati-lab-api
    runtime: python
    plan: free
    region: singapore          # closest to the NSE data you are pulling
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker, explicitly. Each worker is a separate process with its own
    # copy of pandas, the engine and every cache - about 112 MB before it does
    # any work - and the plan allows 512 MB in total.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # The bare /health: no database, no imports. /api/v1/health also checks the
    # database, which is exactly what stops answering while a scan holds it -
    # so using it as the health check got healthy instances replaced.
    healthCheckPath: /health

    # Uncomment together with `plan: starter` above for a real disk.
    # disk:
    #   name: ati-lab-data
    #   mountPath: /var/lib/ati-lab
    #   sizeGB: 5

    envVars:
      # With a disk, point this at its mount path instead.
      # - key: DATA_DB
      #   value: /var/lib/ati-lab/market_data.sqlite3
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Entries per memoised function. The default suits a 512 MB instance;
      # raise it only with more memory.
      - key: CACHE_MAX_ENTRIES
        value: "256"
      # Python returns freed arenas to the OS more readily with fewer of them.
      - key: MALLOC_ARENA_MAX
        value: "2"

      # Browser origins allowed to call this API. The default already covers
      # the deployed frontend and localhost; set this only to add another.
      # Never "*": with credentials that lets any site on the internet call
      # this API as the logged-in user.
      - key: CORS_ORIGINS
        sync: false

      # Shared secret for state-changing requests (scan, sync, watchlist and
      # settings writes). Reads stay open. Leave it unset and those endpoints
      # are open to anyone who can reach the server; set it here AND as
      # API_ACCESS_KEY on the frontend service, where the Next server-side
      # gateway attaches it. It must never be a NEXT_PUBLIC_ variable - those
      # are compiled into the browser bundle.
      - key: API_ACCESS_KEY
        sync: false

      # Credentials. sync:false means Render prompts for them in the dashboard
      # and never stores them in this file.
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false

      # Optional providers. The scanner, backtests and forward tests all work
      # without these.
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Database backup. REQUIRED on the free plan — it is the only thing
      # standing between a container restart and losing everything.
      - key: GH_BACKUP_TOKEN
        sync: false
      - key: GH_REPO
        sync: false
      - key: DB_BACKUP_BRANCH
        value: db-backup
